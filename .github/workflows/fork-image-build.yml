name: Fork image build (DNS UPDATE test)

# Builds the UCM image from this branch and pushes it to the GitHub Container
# Registry of the fork owner: ghcr.io/<owner>/ultimate-ca-manager:dns-update.
# Same steps as the maintainer described in #418: frontend first (the Dockerfile
# copies frontend/dist), then docker build. No secrets other than GITHUB_TOKEN.

on:
  push:
    branches: [claude/relaxed-planck-c6xvuc-dns-update-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Forks only: the project publishes its images from release tags.
    if: github.repository != 'NeySlim/ultimate-ca-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Image name (lower case owner)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ultimate-ca-manager" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dns-update
            ${{ steps.image.outputs.name }}:dns-update-${{ github.sha }}
